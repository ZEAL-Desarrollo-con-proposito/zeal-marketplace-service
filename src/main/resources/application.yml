server:
  port: 8082

spring:
  application:
    name: zeal-marketplace-service
  datasource:
    url: jdbc:postgresql://localhost:5433/zeal_marketplace_db
    username: zeal_user
    password: zeal_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ZealMVP2026ArchitectureSoftwareSecretKeyMinimum256Bits!!

logging:
  level:
    co.zeal: DEBUG
