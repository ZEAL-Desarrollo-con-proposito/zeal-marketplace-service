server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  # Detrás de NGINX: la IP real del cliente sale de X-Forwarded-For (solo de proxies de redes privadas).
  forward-headers-strategy: native
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  lifecycle:
    # Apagado ordenado: termina las peticiones en curso antes de detenerse (R2-3).
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  application:
    name: zeal-marketplace-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/zeal_marketplace_db}
    username: ${DB_USERNAME:zeal_user}
    password: ${DB_PASSWORD:zeal_password}
    hikari:
      # Consultas JDBC (auditoría, bloqueos) sin calificar el esquema.
      schema: marketplace
      # R2-27: pool por réplica. Con 2 réplicas × 2 servicios × 20 = 80 conexiones (max_connections=100).
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Una petición no espera más de esto por una conexión libre: falla rápido en vez de encolarse.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:10000}
      # Una petición nunca espera indefinidamente un bloqueo de fila (SELECT ... FOR UPDATE).
      # Nadie espera indefinidamente un bloqueo de fila (SELECT ... FOR UPDATE de cupos y franjas).
      connection-init-sql: SET lock_timeout = '${PG_LOCK_TIMEOUT:5s}'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: marketplace
        jdbc:
          time_zone: UTC
  flyway:
    schemas: marketplace
    default-schema: marketplace
    # R2-14: las migraciones corren con el usuario PROPIETARIO (SPRING_FLYWAY_USER/PASSWORD) y la app
    # con DB_USERNAME, que la migración V*__security_audit_and_app_role crea y limita.
    placeholders:
      appUser: ${DB_USERNAME:zeal_user}
      appPassword: ${DB_PASSWORD:zeal_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Obligatoria en el despliegue multinodo (Redis en el nodo de datos); vacía en local.
      password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  # R2-30: histogramas para calcular p95 por endpoint en Prometheus; etiquetas comunes por servicio y réplica.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      service: ${spring.application.name}
      replica: ${HOSTNAME:local}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # R2-3: readiness = puede atender (sus dependencias responden): NGINX/Docker la sacan de la
      # rotación si falla. liveness = el proceso está sano; no depende de terceros para que una caída
      # de la base no provoque reinicios en cascada.
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState

app:
  # R2-26: TTL de respaldo de la caché Redis (la invalidación normal es por eventos de dominio).
  cache:
    ttl: ${CACHE_TTL:60s}
  time-zone: ${APP_TIME_ZONE:America/Bogota}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:ZealMVP2026ArchitectureSoftwareSecretKeyMinimum256Bits!!}
      issuer: ${JWT_ISSUER:zeal}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
  workshop-room:
    opens-before-start: 10m
  # Servidor de medios (SFU) de las videollamadas grupales de los talleres.
  livekit:
    # URL con la que el navegador se conecta. Una ruta relativa ("/livekit") usa el mismo origen.
    public-url: ${LIVEKIT_PUBLIC_URL:/livekit}
    api-key: ${LIVEKIT_API_KEY:zeal-dev}
    api-secret: ${LIVEKIT_API_SECRET:ZealLiveKitDevSecretKeyMinimum32Chars!!}

logging:
  # R2-29: una línea JSON por evento (formato Logstash, nativo de Spring Boot) con el MDC (correlationId,
  # userId), servicio y réplica. LOG_FORMAT=ecs|gelf|logstash; en desarrollo se puede sobrescribir
  # LOGGING_STRUCTURED_FORMAT_CONSOLE para volver al formato de texto.
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
    json:
      add:
        service: ${spring.application.name}
        replica: ${HOSTNAME:local}
  level:
    co.zeal: INFO
